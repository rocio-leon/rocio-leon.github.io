    <!--
      Content-Security-Policy is delivered as a meta tag because GitHub Pages
      cannot set response headers. If this ever moves to a host that can
      (Netlify, Cloudflare), move this to a real header and add
      frame-ancestors + X-Content-Type-Options, which meta tags cannot express.

      style-src needs 'unsafe-inline': Emotion (MUI's styling engine) injects
      <style> elements at runtime, and a static host cannot mint per-request
      nonces. img-src needs data: for the inline SVG paper-grain texture.
      No third-party origin is allowed at all — fonts are self-hosted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               form-action 'none';
               base-uri 'self';
               object-src 'none';
               frame-src 'none';
               manifest-src 'self';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
